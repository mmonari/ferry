[package]
name = "ferry-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "ferry's transport: quinn on its own DSCP-marked UDP socket, pinned mutual TLS 1.3"

[lints]
workspace = true

[dependencies]
bytes = "=1.12.1"
nix = { version = "=0.31.3", default-features = false, features = ["net", "socket", "uio"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "=0.11.19", default-features = false }
ring = "=0.17.14"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto", "zeroize"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
sha2 = "=0.11.1"
socket2 = { version = "=0.6.5", features = ["all"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt", "macros", "sync", "time", "net"] }
tracing = "=0.1.44"
zeroize = "=1.9.1"

[dev-dependencies]
# The stall test drives the source's own motion pacing (ferry_core::source::MotionPacer, A-04).
ferry-core = { path = "../ferry-core" }
tokio = { version = "=1.53.3", features = ["rt", "macros", "sync", "time", "net"] }
proptest = "=1.11.0"
tempfile = "=3.27.0"
