[package]
name = "ferry-clip"
description = "ferry's clipboard bridge: ext-data-control-v1 on its own thread and Wayland connection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
calloop = "=0.14.5"
ferry-wl = { path = "../ferry-wl" }
rustix = { version = "=1.1.5", features = ["pipe"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["sync"] }
tracing = "=0.1.44"
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
